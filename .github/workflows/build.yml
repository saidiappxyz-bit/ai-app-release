name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Android App
        run: |
          mkdir temp_app
          cd temp_app
          flutter create --org com.example --platforms android app_build
          cd app_build
          rm -rf lib
          cp -r ../../lib .
          cp ../../pubspec.yaml .
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: temp_app/app_build/build/app/outputs/flutter-apk/app-release.apk
