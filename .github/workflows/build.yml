name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Android App
        run: |
          mkdir temp_app
          cd temp_app
          flutter create . --org com.example --platforms android
          cp -r ../lib .
          cp ../pubspec.yaml .
          cp ../android/app/src/main/AndroidManifest.xml android/app/src/main/
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk
